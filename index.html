<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Qué disfraz me tocó? Halloween familiar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #1a1030;
    --ink: #f6efe6;
    --muted: #b9abd1;
    --panel: #261a45;
    --line: #42306d;

    /* color del tema activo (cambia al revelar) */
    --t-bg: #1a1030;
    --t-accent: #ff8a1f;
    --t-ink: #f6efe6;

    --display: "Bungee", Impact, "Arial Black", sans-serif;
    --body: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--t-bg);
    color: var(--t-ink);
    font-family: var(--body);
    font-size: 18px;
    line-height: 1.45;
    transition: background-color .6s ease, color .4s ease;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 520px;
    padding: 28px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .sun { font-size: 44px; line-height: 1; }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(30px, 9vw, 44px);
    line-height: 1.05;
    margin: 0;
    letter-spacing: .01em;
  }
  .sub { margin: 0; color: var(--muted); max-width: 34ch; transition: color .4s ease; }
  body.revealed .sub { color: inherit; opacity: .8; }

  label { font-weight: 600; display: block; margin-bottom: 8px; }
  .select-wrap { position: relative; }
  select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    font: inherit;
    font-size: 20px;
    font-weight: 500;
    color: var(--ink);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 16px 48px 16px 16px;
    cursor: pointer;
  }
  select:focus-visible { outline: 3px solid var(--t-accent); outline-offset: 2px; }
  .select-wrap::after {
    content: "";
    position: absolute;
    right: 18px; top: 50%;
    width: 10px; height: 10px;
    border-right: 3px solid var(--muted);
    border-bottom: 3px solid var(--muted);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  #result { min-height: 1px; }
  .reveal {
    background: var(--t-accent);
    color: var(--on-accent, #111);
    border-radius: 22px;
    padding: 28px 22px 30px;
    text-align: center;
    animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .reveal .who { margin: 0 0 2px; font-weight: 600; font-size: 20px; }
  .reveal .emoji { font-size: 84px; line-height: 1.1; display: block; margin: 6px 0 4px; }
  .reveal .costume {
    font-family: var(--display);
    font-size: clamp(34px, 11vw, 54px);
    line-height: 1;
    margin: 0 0 12px;
    word-break: break-word;
  }
  .reveal .hint { margin: 0 auto; max-width: 30ch; font-weight: 500; }
  .locked {
    margin: 14px 0 0;
    font-size: 15px;
    opacity: .85;
    text-align: center;
  }
  @keyframes pop {
    from { transform: scale(.85) rotate(-2deg); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; }
    body { transition: none; }
  }

  /* temas */
  body[data-theme="griegos"]     { --t-bg: #0f2a4a; --t-accent: #f2e3b3; --t-ink: #f4f7fb; --on-accent: #12355e; }
  body[data-theme="vikingos"]    { --t-bg: #22262b; --t-accent: #8fc2e6; --t-ink: #eef2f5; --on-accent: #15202a; }
  body[data-theme="superheroes"] { --t-bg: #6d0f1c; --t-accent: #ffd21f; --t-ink: #fff6e0; --on-accent: #6d0f1c; }
  body[data-theme="villanos"]    { --t-bg: #1c0d2e; --t-accent: #8ee000; --t-ink: #f0e8fa; --on-accent: #1c0d2e; }
  body[data-theme] select { border-color: var(--t-accent); }

  .code-row { display: flex; gap: 10px; }
  input#codigo {
    flex: 1; min-width: 0;
    font: inherit; font-family: var(--display); font-size: 30px;
    letter-spacing: .3em; text-align: center;
    color: var(--ink); background: var(--panel);
    border: 2px solid var(--line); border-radius: 14px;
    padding: 12px 10px;
  }
  input#codigo::placeholder { color: var(--muted); opacity: .5; }
  input#codigo:focus-visible, button#ir:focus-visible { outline: 3px solid var(--t-accent); outline-offset: 2px; }
  button#ir {
    font: inherit; font-weight: 600; font-size: 18px;
    color: #1a1030; background: #ff8a1f;
    border: 0; border-radius: 14px; padding: 0 20px; cursor: pointer;
  }
  button#ir:active { transform: scale(.97); }
  .err { min-height: 1.4em; margin: 10px 0 0; color: #ffb3a6; font-weight: 500; }
  body[data-theme] input#codigo { border-color: var(--t-accent); }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  .shake { animation: shake .35s; }
</style>
</head>
<body>
<main>
  <header>
    <div class="sun" aria-hidden="true">🎃</div>
    <h1>El destino ya habló...</h1>
    <p class="sub">Los espíritus del sorteo eligieron el disfraz de tu familia y lo guardaron bajo un número secreto. ¿Te atreves a descubrirlo? 👻</p>
  </header>

  <section>
    <label for="codigo">Escribe tu número secreto</label>
    <div class="code-row">
      <input id="codigo" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0000" aria-describedby="err">
      <button id="ir" type="button">Revelar</button>
    </div>
    <p id="err" class="err" role="alert"></p>
  </section>

  <section id="result" aria-live="polite"></section>
</main>

<script>
  const TEMAS = {
    griegos:     { nombre: "Griegos",     emoji: "🏛️", pista: "Túnicas, coronas de laurel y sandalias. ¡A lo Olimpo!" },
    vikingos:    { nombre: "Vikingos",    emoji: "🪓", pista: "Pieles, cascos con cuernos y mucha barba (real o dibujada)." },
    superheroes: { nombre: "Superhéroes", emoji: "🦸", pista: "Capa, antifaz y una pose poderosa para las fotos." },
    villanos:    { nombre: "Villanos",    emoji: "🦹", pista: "Lo oscuro manda. Risa malvada incluida." }
  };

  const NOMBRES = ["Helda", "Jhon", "Juliana", "Lucero", "Maira", "Manuela", "Marcela", "Martha", "Paola", "Pipe Sanchez"];
  const SALT = "halloween-familiar-2026";
  // Solo guardamos huellas: el código y el disfraz no se pueden leer directamente aquí.
  const HUELLAS = new Set(["42f25272422185e33650938445586e98bf72de9eb8864ce5ad29e3536ea1af9f", "29c2afa253d2edc48edbdb63e470c029de9866b73600c3586f40351ceb458d00", "d7f7f969a4c15e39f989d3337157f3969078c6ad802fffe538aa41b4e1bca1e4", "1e98f1dfbf2f5e05cf2911c0d4b958780598c77d1e35b2f15cc4696ecffb6e0a", "d0f42e2c2fe713168f7399b5fae6ab4c7466f6462714e97f1ad5da46301ba1a4", "1be221aeb1c47f14b8914bba8fdc045340df9c89713a69d07bbf19ccaaa76363", "848c7fefaf154af0809dd086024e75ea29fc6bb123c2c0bb9f17cf6e52e2e710", "15f8403391be348aac23d6f9eeedc977f29db7d3b3fd685c1196cb499107b5a9", "85e309b223eedcf28286278bcf3a288293aa340b45cc3379a8086284e89c5923", "5374373e76cfab6e05d88b66556f15eb983e776b3d9a9329ed3df8d27128a4af"]);

  const input = document.getElementById("codigo");
  const btn = document.getElementById("ir");
  const err = document.getElementById("err");
  const result = document.getElementById("result");

  async function sha256(txt) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function buscar(codigo) {
    for (const nombre of NOMBRES) {
      for (const clave of Object.keys(TEMAS)) {
        if (HUELLAS.has(await sha256(`${SALT}|${codigo}|${nombre}|${clave}`))) {
          return { nombre, clave };
        }
      }
    }
    return null;
  }

  function limpiar() {
    result.innerHTML = "";
    document.body.removeAttribute("data-theme");
    document.body.classList.remove("revealed");
  }

  async function revelar() {
    const codigo = input.value.trim();
    err.textContent = "";
    limpiar();

    if (!/^\d{4}$/.test(codigo)) {
      err.textContent = "Tu número tiene 4 dígitos. Revísalo e inténtalo de nuevo.";
      return;
    }

    let hallado = null;
    try { hallado = await buscar(codigo); }
    catch (e) { err.textContent = "No se pudo abrir el sobre. Prueba desde otro navegador."; return; }

    if (!hallado) {
      err.textContent = "Ese número no abre ningún destino. Verifica que esté bien escrito.";
      input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
      return;
    }

    const t = TEMAS[hallado.clave];
    document.body.setAttribute("data-theme", hallado.clave);
    document.body.classList.add("revealed");

    const card = document.createElement("div");
    card.className = "reveal";

    const who = document.createElement("p");
    who.className = "who";
    who.textContent = hallado.nombre + ", la noche ha hablado: tu familia va de...";

    const emoji = document.createElement("span");
    emoji.className = "emoji";
    emoji.setAttribute("aria-hidden", "true");
    emoji.textContent = t.emoji;

    const costume = document.createElement("p");
    costume.className = "costume";
    costume.textContent = t.nombre;

    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = t.pista;

    card.append(who, emoji, costume, hint);

    const locked = document.createElement("p");
    locked.className = "locked";
    locked.textContent = "🕯️ El destino está sellado. Puedes volver cuantas veces quieras, pero el resultado no cambia.";

    result.append(card, locked);
  }

  input.addEventListener("input", () => { input.value = input.value.replace(/\D/g, "").slice(0, 4); });
  input.addEventListener("keydown", e => { if (e.key === "Enter") revelar(); });
  btn.addEventListener("click", revelar);
</script>
</body>
</html>
